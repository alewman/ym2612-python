[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ym2612-python"
version = "0.1.0.dev0"
description = "Readable, pure-Python Yamaha YM2612 / YM3438 (OPN2) reference core, equal to Nuked-OPN2 on every internal cycle"
readme = "README.md"
# The floor is the newest Python PyPy supports (3.11 as of PyPy 7.3.x); raise it when PyPy does.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.urls]
Repository = "https://github.com/alewman/ym2612-python"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    # Pinned: `ruff format --check` in CI must see the formatter the tree was formatted with.
    "ruff==0.16.8",
]

[project.scripts]
ym2612-conformance = "ym2612_python.conformance:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ym2612_python"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".pytest_cache", "reference"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]
ignore = ["SIM108"]

[tool.ruff.lint.per-file-ignores]
# The mutants are exact source lines, kept whole so each reads as the line it breaks.
"scripts/mutation.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["ym2612_python"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
pythonpath = ["src", "tests", "scripts"]
markers = ["referee: needs the referees built by validation/build_referees.sh"]
